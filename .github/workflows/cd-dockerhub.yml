name: CD - Docker Hub

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify-healthcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy code về máy ảo
        uses: actions/checkout@v4

      - name: Chạy docker compose và chờ healthy
        run: docker compose up -d --build --wait --wait-timeout 120

      - name: Kiểm tra /health
        run: curl -sf http://localhost:3000/health

      - name: In log nếu lỗi
        if: failure()
        run: docker compose logs

      - name: Dọn dẹp
        if: always()
        run: docker compose down -v

  push-to-dockerhub:
    runs-on: ubuntu-latest
    needs: verify-healthcheck
    steps:
      - name: Lấy code về máy ảo
        uses: actions/checkout@v4

      - name: Cài Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Đăng nhập Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build và đẩy image lên Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/product-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/product-api:${{ github.sha }}
