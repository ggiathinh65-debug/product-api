name: Product  production-like)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-crud:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      PORT: 3000
      MONGO_URI: mongodb://localhost:27017/productdb_ci
    steps:
      - name: Lấy code về máy ảo
        uses: actions/checkout@v4

      - name: Cài Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Cài thư viện
        run: npm ci

      - name: Kiểm tra cú pháp code
        run: |
          node --check src/index.js
          node --check src/models/Product.js
          node --check src/routes/products.js

      - name: Chờ MongoDB mở cổng
        run: |
          for i in $(seq 1 30); do
            if (echo > /dev/tcp/localhost/27017) 2>/dev/null; then
              echo "MongoDB sẵn sàng"
              exit 0
            fi
            sleep 2
          done
          echo "MongoDB không lên"
          exit 1

      - name: Chạy API nền
        run: nohup node src/index.js > api.log 2>&1 &

      - name: Chờ API sẵn sàng (/health)
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/health; then
              echo
              echo "API sẵn sàng"
              exit 0
            fi
            sleep 2
          done
          echo "API không lên được"
          cat api.log
          exit 1

      - name: Test CRUD
        run: |
          set -e
          BASE=http://localhost:3000
          echo "== CREATE =="
          curl -sf -X POST $BASE/api/products -H "Content-Type: application/json" -d '{"pid":"CI01","pname":"Laptop CI","price":1500,"quantity":10}' | tee create.json
          echo
          grep -q '"pid":"CI01"' create.json
          echo "== READ ALL =="
          curl -sf $BASE/api/products | grep -q '"pid":"CI01"'
          echo "== READ ONE =="
          curl -sf $BASE/api/products/CI01 | grep -q '"pname":"Laptop CI"'
          echo "== UPDATE =="
          curl -sf -X PUT $BASE/api/products/CI01 -H "Content-Type: application/json" -d '{"price":1400,"quantity":8}' | grep -q '"price":1400'
          echo "== DELETE =="
          curl -sf -X DELETE $BASE/api/products/CI01 > /dev/null
          echo "== VERIFY DELETED =="
          test "$(curl -s -o /dev/null -w '%{http_code}' $BASE/api/products/CI01)" = "404"
          echo "CRUD OK"

      - name: In log API nếu lỗi
        if: failure()
        run: cat api.log

  docker-compose-check:
    runs-on: ubuntu-latest
    needs: test-crud
    steps:
      - name: Lấy code về máy ảo
        uses: actions/checkout@v4

      - name: Chạy docker compose và chờ healthy
        run: docker compose up -d --build --wait --wait-timeout 120

      - name: Xem trạng thái container
        run: docker compose ps

      - name: Kiểm tra /health
        run: curl -sf http://localhost:3000/health

      - name: In log nếu lỗi
        if: failure()
        run: docker compose logs

      - name: Dọn dẹp
        if: always()
        run: docker compose down -v
